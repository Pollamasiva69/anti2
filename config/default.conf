{
  "network": {
    "interface": "eth0",
    "promiscuous": true,
    "snaplen": 65535
  },
  "workers": 4,
  "cpu_affinity": true,
  "numa_aware": false,
  "thresholds": {
    "udp_pps": 10000,
    "tcp_syn_pps": 5000,
    "tcp_ack_pps": 8000,
    "icmp_pps": 1000,
    "http_rps": 100
  },
  "ratelimit": {
    "enabled": true,
    "pps": 1000,
    "bps": 10000000
  },
  "auto_blacklist": {
    "enabled": true,
    "duration": 3600
  },
  "geoip": {
    "enabled": false,
    "database": "/usr/share/GeoIP/GeoLite2-Country.mmdb",
    "blocked_countries": ["CN", "RU", "KP"]
  },
  "xdp": {
    "enabled": false,
    "program": "ebpf/xdp_filter.o"
  },
  "http_protection": {
    "enabled": true,
    "js_challenge": false,
    "captcha": false,
    "user_agent_blacklist": [
      "masscan",
      "zgrab",
      "nmap"
    ]
  },
  "logging": {
    "file": "/var/log/ddos-protect.log",
    "level": "info",
    "syslog": true
  },
  "api": {
    "enabled": true,
    "bind_address": "127.0.0.1",
    "port": 8080,
    "auth_token": "change-this-secret-token"
  },
  "dashboard": {
    "enabled": true,
    "port": 8081
  },
  "security": {
    "chroot": false,
    "chroot_dir": "/var/empty",
    "drop_user": "nobody",
    "drop_group": "nogroup",
    "seccomp": false
  }
}
